[project]
name = "pixel-posture"
version = "1.0.0"
description = "Privacy-conscious webcam posture companion with a pixel-art pet."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["showcase", "local-app/packaging"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = [
    "PLR2004", # thresholds live in named config objects; small literals in tests are fine
    "PLR0913",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "N802",    # Qt overrides use camelCase (closeEvent, paintEvent)
    "RUF001",  # en dashes and the multiplication sign are intentional UI typography
    "RUF005",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "main"]

[tool.ruff.lint.per-file-ignores]
"local-app/tests/*" = ["PLC0415", "SLF001", "PLR0917"]

[tool.mypy]
python_version = "3.11"
mypy_path = "local-app"
files = ["local-app/app", "local-app/main.py", "local-app/scripts"]
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["local-app/tests"]
pythonpath = ["local-app"]
qt_api = "pyside6"
addopts = "-ra"
