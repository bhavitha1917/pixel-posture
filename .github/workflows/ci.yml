name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop app (Windows)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Unit and lifecycle tests use synthetic observations; no camera or models needed.
      - run: pytest

  website:
    name: Showcase website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
